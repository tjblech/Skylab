<!doctype html>
<html><head><meta charset="utf-8"><title>SKYLAB frame</title>
<style>
  html,body{margin:0;padding:0;background:#ff00ff}
  #f{position:absolute;left:0;top:0;width:393px;height:957px;border:0;display:block}
</style></head>
<body>
<script>
  const p = new URLSearchParams(location.search);
  const page = p.get('p') || 'now';
  const h = p.get('h');
  const f = document.createElement('iframe');
  if (h) f.style.height = h + 'px';
  f.id = 'f';
  f.src = 'index.html#' + page;
  document.body.appendChild(f);
</script>
</body></html>
